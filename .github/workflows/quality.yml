name: Qualidade da Central PG Bot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  logica:
    name: Regras e integridade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe JavaScript
        run: node --check app.js
      - name: Testes de regras
        run: node --test tests/core-tests.cjs
      - name: Manifesto e estrutura
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m py_compile tests/smoke_v15.py tests/cross_tab_smoke.py
          test -f assets/favicon.svg

  navegadores:
    name: Interface mobile 320 e 390 px
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Preparar cliente Python do Playwright
        run: python -m pip install --no-cache-dir playwright==1.58.0
      - name: Validar Chromium, Firefox e WebKit em 320/390 px
        env:
          HOME: /root
        run: python tests/smoke_v15.py
      - name: Proteger registros em duas abas
        env:
          HOME: /root
          PG_USE_HTTP: '1'
        run: python tests/cross_tab_smoke.py
